<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agency Blueprint — Detailed Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #f5f2ec;
  --surface: #ffffff;
  --surface2: #f0ece4;
  --border: #e0d9ce;
  --border2: #d0c8bc;
  --ink: #1a1612;
  --ink2: #4a4540;
  --ink3: #8a8278;
  --accent: #c8410a;
  --accent2: #1a6b3c;
  --accent3: #1a3a6b;
  --gold: #b8860b;
  --sub-bg: #faf8f4;
  --done-bg: #f0f7f2;
  --done-border: #c8e6d4;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Instrument Sans', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  background: var(--ink);
  color: #f5f2ec;
  padding: 28px 20px 22px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.header-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 4px;
}

.header-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1;
  color: #f5f2ec;
}

.header-title span { color: var(--accent); }

.header-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
  align-items: center;
}

.meta-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 3px;
  background: rgba(245,242,236,0.08);
  color: rgba(245,242,236,0.5);
  border: 1px solid rgba(245,242,236,0.12);
}
.meta-pill.hot { background: rgba(200,65,10,0.2); border-color: rgba(200,65,10,0.4); color: #e8896a; }

.header-back {
  display: inline-block;
  margin-top: 16px;
  padding: 8px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(245,242,236,0.05);
  border: 1px solid rgba(200,65,10,0.3);
  border-radius: 4px;
  text-decoration: none;
  transition: all 0.2s;
}
.header-back:hover {
  background: var(--accent);
  color: #f5f2ec;
  border-color: var(--accent);
}

.progress-wrap {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-track {
  flex:1;
  height: 3px;
  background: rgba(245,242,236,0.1);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #e86030);
  border-radius: 99px;
  transition: width 0.4s cubic-bezier(.4,0,.2,1);
}

.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(245,242,236,0.4);
  white-space: nowrap;
}

/* ── PHASE NAV ── */
.phase-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.phase-nav::-webkit-scrollbar { display: none; }

.phase-nav-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 10px 12px;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--ink3);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.phase-nav-btn:hover { color: var(--ink); }
.phase-nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── STATS BAR ── */
.stats-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background-color: var(--border);
}

.stat {
  background: var(--surface);
  padding: 8px 12px;
  text-align: center;
}

.stat-n {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}

.stat-l {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-top: 2px;
}

/* ── MAIN ── */
.main { max-width: 900px; margin: 0 auto; padding: 20px 14px 80px; }

/* ── PHASE BLOCK ── */
.phase-block {
  margin-bottom: 32px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
}

.phase-block.hidden { display: none; }

.phase-header-bar {
  padding: 16px 18px;
  background: var(--ink);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

.phase-num {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--ink3);
  min-width: 28px;
}

.phase-name {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #f5f2ec;
  flex: 1;
}

.phase-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
  background: rgba(200,65,10,0.25);
  color: #e8896a;
  border: 1px solid rgba(200,65,10,0.3);
}

.phase-progress-mini {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink3);
  white-space: nowrap;
}

.phase-toggle {
  font-size: 12px;
  color: var(--ink3);
  transition: transform 0.2s;
}

.phase-block.collapsed .phase-toggle { transform: rotate(-90deg); }

.phase-body {
  padding: 0;
}

.phase-block.collapsed .phase-body { display: none; }

/* ── TASK ── */
.task-group {
  border-bottom: 1px solid var(--border);
}
.task-group:last-child { border-bottom: none; }

.task-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 18px;
  background: var(--surface);
  cursor: pointer;
  transition: background 0.12s;
  border-bottom: 1px solid var(--surface2);
}

.task-row:hover { background: var(--sub-bg); }
.task-row.done { background: var(--done-bg); }

.task-check {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--border2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
  font-size: 10px;
  color: transparent;
}

.task-row.done .task-check {
  background: var(--accent2);
  border-color: var(--accent2);
  color: white;
}

.task-content { flex: 1; }

.task-title {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}

.task-row.done .task-title {
  text-decoration: line-through;
  color: var(--ink3);
}

.task-desc {
  font-size: 12px;
  color: var(--ink2);
  margin-top: 2px;
  font-style: italic;
}

.task-meta-row {
  display: flex;
  gap: 5px;
  margin-top: 5px;
  flex-wrap: wrap;
  align-items: center;
}

.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 2px;
  font-weight: 500;
}

.tag-marketing { background:#fff0ea; color:#c8410a; border:1px solid #f5c9b8; }
.tag-sales { background:#fff7ea; color:#b87000; border:1px solid #f5dfa0; }
.tag-ops { background:#eaf4ff; color:#1a3a6b; border:1px solid #b8d4f5; }
.tag-finance { background:#eafff2; color:#1a6b3c; border:1px solid #b8e6cc; }
.tag-people { background:#ffeaea; color:#6b1a1a; border:1px solid #f5b8b8; }
.tag-cx { background:#eaefff; color:#1a2a6b; border:1px solid #b8c8f5; }
.tag-legal { background:#f5eaff; color:#4a1a6b; border:1px solid #d8b8f5; }
.tag-tech { background:#eafffa; color:#0a4a40; border:1px solid #b8e6de; }

.priority {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  padding: 2px 6px;
  border-radius: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.p-high { background:#fff0ee; color:#c8410a; border:1px solid #f5c0b0; }
.p-med  { background:#fffbee; color:#946800; border:1px solid #f5e0a0; }
.p-low  { background:#eefff3; color:#1a6b3c; border:1px solid #b0e8c8; }

.expand-sub {
  font-size: 10px;
  color: var(--ink3);
  margin-left: auto;
  flex-shrink: 0;
  padding: 2px 4px;
  transition: transform 0.2s;
  cursor: pointer;
}

.task-group.sub-open .expand-sub { transform: rotate(90deg); }

/* ── SUBTASKS ── */
.subtask-list {
  display: none;
  background: var(--sub-bg);
  border-top: 1px solid var(--border);
}

.task-group.sub-open .subtask-list { display: block; }

.subtask-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 18px 10px 44px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
}

.subtask-row:last-child { border-bottom: none; }
.subtask-row:hover { background: #eee9e0; }
.subtask-row.done { background: #ecf7f0; }

.sub-check {
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--border2);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
  transition: all 0.15s;
  font-size: 8px;
  color: transparent;
}

.subtask-row.done .sub-check {
  background: var(--accent2);
  border-color: var(--accent2);
  color: white;
}

.subtask-body { flex: 1; }

.subtask-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
}

.subtask-row.done .subtask-title {
  text-decoration: line-through;
  color: var(--ink3);
}

.subtask-detail {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 1px;
  font-style: italic;
}

.subtask-tool {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  background: var(--border);
  color: var(--ink2);
  padding: 1px 5px;
  border-radius: 2px;
  margin-top: 3px;
  display: inline-block;
}

/* SUB COUNT BADGE */
.sub-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  background: var(--border);
  color: var(--ink3);
  padding: 1px 5px;
  border-radius: 10px;
  flex-shrink: 0;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .header {
    padding: 20px 16px 18px;
  }
  .header-title {
    font-size: clamp(24px, 6vw, 32px);
  }
  .header-eyebrow {
    font-size: 8px;
  }
  .header-meta {
    gap: 4px;
    margin-top: 10px;
  }
  .meta-pill {
    font-size: 8px;
    padding: 2px 7px;
  }
  .header-back {
    width: 100%;
    text-align: center;
    padding: 10px 16px;
    margin-top: 14px;
  }
  .phase-nav {
    padding: 12px;
    gap: 6px;
  }
  .phase-nav-btn {
    font-size: 9px;
    padding: 8px 12px;
  }
  .stat-box {
    padding: 12px;
  }
  .phase-card {
    padding: 16px;
  }
}

@media (max-width: 480px) {
  .header {
    padding: 16px 12px;
  }
  .header-title {
    font-size: 22px;
  }
  .header-back {
    font-size: 9px;
    padding: 8px 12px;
  }
  .phase-nav-btn {
    font-size: 8px;
    padding: 6px 10px;
  }
}
</style>
</head>

            <div class="subtask-title">${sub.title}</div>
            ${sub.detail ? `<div class="subtask-detail">${sub.detail}</div>` : ''}
            ${sub.tool ? `<span class="subtask-tool">🔧 ${sub.tool}</span>` : ''}
          </div>
        </div>`;
    }).join('');

    const tagsHTML = (task.tags||[]).map(t => `<span class="tag tag-${t}">${t}</span>`).join('');
    const prioClass = task.priority === 'high' ? 'p-high' : task.priority === 'med' ? 'p-med' : 'p-low';
    const prioLabel = task.priority === 'high' ? '● High' : task.priority === 'med' ? '● Med' : '● Low';

    return `
      <div class="task-group" id="tg-${taskId}">
        <div class="task-row" id="${taskId}" onclick="toggleTask('${taskId}', event)">
          <div class="task-check">✓</div>
          <div class="task-content">
            <div class="task-title">${task.title}</div>
            <div class="task-desc">${task.desc}</div>
            <div class="task-meta-row">
              ${tagsHTML}
              <span class="priority ${prioClass}">${prioLabel}</span>
            </div>
          </div>
          <span class="sub-count">${task.subs.length} steps</span>
          <span class="expand-sub" onclick="toggleSubs('tg-${taskId}', event)">▶</span>
        </div>
        <div class="subtask-list">
          ${subsHTML}
        </div>
      </div>`;
  }).join('');

  phaseEl.innerHTML = `
    <div class="phase-header-bar" onclick="togglePhase('${phaseEl.id}')">
      <div class="phase-num">PHASE ${String(phase.id).padStart(2,'0')}</div>
      <div class="phase-name">${phase.title}</div>
      <div class="phase-badge">${phase.timeline}</div>
      <div class="phase-progress-mini" id="pp-${phase.id}">0/${phase.tasks.length}</div>
      <div class="phase-toggle">▼</div>
    </div>
    <div class="phase-body">${tasksHTML}</div>
  `;

  main.appendChild(phaseEl);
});

// ═══════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════
function togglePhase(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

function toggleSubs(groupId, e) {
  e.stopPropagation();
  document.getElementById(groupId).classList.toggle('sub-open');
}

function toggleTask(id, e) {
  e.stopPropagation();
  const el = document.getElementById(id);
  el.classList.toggle('done');
  updateProgress();
  save();
}

function toggleSub(id, e) {
  e.stopPropagation();
  const el = document.getElementById(id);
  el.classList.toggle('done');
  updateProgress();
  save();
}

function updateProgress() {
  const allTasks = document.querySelectorAll('.task-row');
  const allSubs = document.querySelectorAll('.subtask-row');
  const doneTasks = document.querySelectorAll('.task-row.done');
  const doneSubs = document.querySelectorAll('.subtask-row.done');

  const total = allTasks.length + allSubs.length;
  const done = doneTasks.length + doneSubs.length;
  const pct = total ? Math.round(done/total*100) : 0;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total}`;
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sDone').textContent = done;
  document.getElementById('sLeft').textContent = total - done;
  document.getElementById('sPct').textContent = pct + '%';

  // Update phase mini progress
  PHASES.forEach(phase => {
    const phaseTasks = document.querySelectorAll(`#phase-${phase.id} .task-row.done`);
    document.getElementById(`pp-${phase.id}`).textContent = `${phaseTasks.length}/${phase.tasks.length}`;
  });
}

function scrollToPhase(id, btn) {
  document.querySelectorAll('.phase-nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (id === 0) {
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    const el = document.getElementById(`phase-${id}`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function save() {
  const taskStates = {};
  document.querySelectorAll('.task-row[id], .subtask-row[id]').forEach(el => {
    taskStates[el.id] = el.classList.contains('done') ? 1 : 0;
  });
  try { localStorage.setItem('agency_v2_tasks', JSON.stringify(taskStates)); } catch(e){}
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem('agency_v2_tasks') || '{}');
    Object.entries(saved).forEach(([id, done]) => {
      if (done) {
        const el = document.getElementById(id);
        if (el) el.classList.add('done');
      }
    });
  } catch(e){}
  updateProgress();
}

load();
</script>
</body>
</html>
